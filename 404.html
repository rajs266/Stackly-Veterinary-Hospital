<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly Veterinary Hospital</title>
  <meta name="description" content="The requested page or resource could not be found. Return to Stackly Veterinary Hospital homepage.">
  <link rel="icon" type="image/webp" href="assets/top-logo.webp">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-404-body">
  <div id="site-preloader" class="site-preloader" aria-live="polite" aria-busy="true">
    <div class="preloader-bg"></div>
    <div class="preloader-waves" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="preloader-floaters" aria-hidden="true">
      <i class="pf pf1"></i><i class="pf pf2"></i><i class="pf pf3"></i>
      <i class="pf pf4"></i><i class="pf pf5"></i><i class="pf pf6"></i>
    </div>
    <div class="preloader-inner">
      <div class="preloader-spinner" aria-hidden="true">
        <div class="spin-halo"></div>
        <svg class="spin-ring spin-ring-a" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" pathLength="100"></circle>
        </svg>
        <svg class="spin-ring spin-ring-b" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="42" pathLength="100"></circle>
        </svg>
        <svg class="spin-ring spin-ring-c" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="32" pathLength="100"></circle>
        </svg>
        <div class="spin-core">
          <svg class="spin-mark" viewBox="0 0 64 64" role="img" aria-hidden="true">
            <path class="spin-heart" d="M32 54S10 40 10 24c0-8 6-14 14-14 5 0 8 3 8 3s3-3 8-3c8 0 14 6 14 14 0 16-22 30-22 30z"/>
            <path class="spin-plus" d="M32 18v16M24 26h16"/>
          </svg>
        </div>
      </div>
      <img src="assets/logo.webp" alt="Stackly" class="preloader-logo" width="160" height="48">
      <p class="preloader-text">Preparing gentle care<span class="preloader-dots"></span></p>
      <div class="preloader-bar"><span></span></div>
    </div>
  </div>

  <div class="page-404-bg-particles">
    <i class="fa-solid fa-stethoscope p404-icon-float p404-icon-1"></i>
    <i class="fa-solid fa-heart-pulse p404-icon-float p404-icon-2"></i>
    <i class="fa-solid fa-kit-medical p404-icon-float p404-icon-3"></i>
    <i class="fa-solid fa-bone p404-icon-float p404-icon-4"></i>
    <i class="fa-solid fa-syringe p404-icon-float p404-icon-5"></i>
    <i class="fa-solid fa-paw p404-icon-float p404-icon-6"></i>
  </div>

  <div class="p404-card">
    <div style="margin-bottom:16px;">
      <a href="index.html" class="brand-logo" style="display:inline-flex;">
        <img src="assets/logo.webp" alt="Stackly Logo" style="height:48px;filter:brightness(0) invert(1) drop-shadow(0 4px 14px rgba(224,109,83,0.5));">
      </a>
    </div>

    <div class="p404-number-box">
      <span>4</span>
      <span class="p404-paw-glow">
        <i class="fa-solid fa-paw"></i>
      </span>
      <span>4</span>
    </div>

    <h1 class="p404-title">Oops! Woof! Page Not Found</h1>
    <p class="p404-desc">The link or page you requested could not be found. It may have been moved, renamed, or is temporarily undergoing medical triage.</p>

    <div class="p404-actions">
      <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
      <button type="button" onclick="history.back()" class="btn btn-secondary" style="background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3);backdrop-filter:blur(10px);"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
